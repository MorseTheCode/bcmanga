<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Black Clover Manga</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <header>
    <h1>Read Black Clover Manga</h1>
  </header>

  <div class="manga-container">
    <div class="manga-list" id="mangaList"></div>
    
    <div class="volume-selector" id="volumeSelector" style="display: none;">
      <div class="cover-container">
        <img id="mangaCover" src="" alt="Capa do Mangá" class="manga-cover">
      </div>
      
      <div class="volume-controls">
        <select id="volumeDropdown">
          <option value="">-- Selecionar Volume --</option>
        </select>
        <button id="readButton">Ler</button>
      </div>
      
      <div id="loadingMessage" style="display: none;">
        <p>Carregando capítulo...</p>
        <div class="loader"></div>
      </div>
    </div>
  </div>

  <div class="viewer" id="viewer" style="display: none;">
    <div class="viewer-header">
      <button id="closeViewer">× Fechar</button>
      <h3 id="viewerTitle">Volume 1</h3>
      <div class="page-controls">
        <button id="prevPage">← Anterior</button>
        <span id="pageIndicator">1/10</span>
        <button id="nextPage">Próxima →</button>
      </div>
    </div>
    <div class="viewer-content">
      <img id="currentPage" src="" alt="Página atual">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
