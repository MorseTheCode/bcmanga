<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Manga Reader</h1>
  </header>

  <div class="manga-container">
    <div class="manga-list" id="mangaList">
      <!-- Mangás serão carregados aqui -->
    </div>
    
    <div class="volume-selector" id="volumeSelector" style="display: none;">
      <div class="cover-container">
        <img id="mangaCover" src="" alt="Capa do Mangá" class="manga-cover">
      </div>
      
      <div class="volume-controls">
        <select id="volumeDropdown">
          <option value="">-- Selecionar Volume --</option>
        </select>
        <button id="readButton">Ler</button>
      </div>
      
      <div id="loadingMessage" style="display: none;">
        <p>Carregando volume...</p>
        <div class="loader"></div>
      </div>
    </div>
  </div>

  <div class="viewer" id="viewer" style="display: none;">
    <div class="viewer-header">
      <button id="closeViewer">× Fechar</button>
      <div class="viewer-controls">
        <button id="prevSpread">← Página Anterior</button>
        <span id="pageIndicator">1-2/30</span>
        <button id="nextSpread">Próxima Página →</button>
        <label>
          <input type="checkbox" id="singlePageMode"> Modo página única
        </label>
      </div>
    </div>
  
    <div class="spread-container" id="spreadContainer">
    <!-- Páginas serão inseridas aqui -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
