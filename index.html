<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Mangá</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Leitor de Mangá</h1>
      <div class="theme-switch">
        <span>Modo Escuro</span>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </header>

  <main>
    <!-- Lista de Mangás -->
    <div class="manga-list" id="mangaList">
      <!-- Mangás serão carregados aqui -->
    </div>

    <!-- Seletor de Volumes -->
    <div class="volume-selector" id="volumeSelector" style="display: none;">
      <div class="volume-header">
        <button id="backButton" class="back-button">
          <span class="arrow">←</span> Voltar
        </button>
        <h2 id="mangaTitle" class="manga-title"></h2>
      </div>
      
      <div class="cover-container">
        <img id="mangaCover" class="manga-cover-large" src="" alt="Capa do Mangá">
      </div>
      
      <div class="volume-controls">
        <div class="select-wrapper">
          <select id="volumeDropdown" class="volume-dropdown">
            <option value="">-- Selecionar Volume --</option>
          </select>
        </div>
        <button id="readButton" class="read-button">Ler Volume</button>
      </div>
    </div>

    <!-- Visualizador -->
    <div class="viewer" id="viewer" style="display: none;">
      <div class="viewer-header">
        <button id="closeViewer" class="close-button">×</button>
        <div class="viewer-title-controls">
          <h3 id="volumeTitle" class="volume-title"></h3>
          <div class="viewer-volume-selector">
            <select id="viewerVolumeDropdown" class="volume-dropdown">
              <option value="">-- Trocar Volume --</option>
            </select>
          </div>
        </div>
        <div class="viewer-controls">
          <button id="prevBtn" class="nav-button">← Voltar Página</button>
          <div class="page-selector">
            <span>Página: </span>
            <select id="pageDropdown" class="page-dropdown">
              <option value="0">1</option>
            </select>
            <span id="totalPages">/ 1</span>
          </div>
          <button id="nextBtn" class="nav-button">Avançar Página →</button>
          <label class="toggle-switch">
            <input type="checkbox" id="doublePageMode" checked>
            <span class="slider"></span>
            <span class="labels" data-on="Páginas Duplas" data-off="Página Única"></span>
          </label>
        </div>
      </div>
      
      <div class="pages-container" id="pagesContainer">
        <!-- Páginas serão carregadas aqui -->
      </div>
    </div>
  </main>

  <footer>
    <p>Leitor de Mangá © 2023 - Desenvolvido com ♥</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
